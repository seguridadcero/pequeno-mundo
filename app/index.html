<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f6f3ea"><link rel="manifest" href="./manifest.webmanifest"><title>Pequeño Mundo</title><style>
:root{font-family:system-ui,-apple-system,sans-serif;color:#23443a;background:#f6f3ea}*{box-sizing:border-box}body{margin:0}button{font:inherit;cursor:pointer}button:focus-visible{outline:4px solid #145b9b;outline-offset:3px}.shell{max-width:1050px;margin:auto;min-height:100dvh;padding:8px 12px}header{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:54px}.brand{white-space:nowrap;font-weight:850;font-size:clamp(18px,4vw,25px)}.home{border:2px solid #b5cbbd;border-radius:16px;background:white;min-height:52px;padding:8px 16px;font-weight:750}.global-actions{display:flex;gap:8px;align-items:center}.home[hidden],.catalog[hidden],.player[hidden]{display:none}.catalog{text-align:center;padding:30px 4px}.catalog h1{font-size:clamp(30px,7vw,46px);margin:0 0 8px}.catalog p{font-size:18px;color:#52675b}.games{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px;margin:30px 0}.game{border:3px solid #c7d9cd;background:#fffefa;border-radius:26px;min-height:235px;padding:20px 10px;box-shadow:0 5px 0 #d5dfd5;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px}.game:active{transform:translateY(2px)}.art{font-size:clamp(48px,10vw,80px)}.game strong{font-size:clamp(22px,5vw,29px)}.game span:last-child{font-size:15px;color:#567064}.player{margin-top:0}.frame{display:block;border:0;width:100%;height:calc(100dvh - 70px);min-height:0;background:#f6f3ea;border-radius:14px}.caption{font-size:14px;color:#5c7064} @media(max-width:650px){.games{grid-template-columns:repeat(2,minmax(0,1fr))}.game:last-child{grid-column:1/-1;min-height:150px}}@media(max-width:430px){.brand{font-size:clamp(16px,4.2vw,19px)}#listenGlobal{font-size:22px;min-width:46px;padding:4px 7px}.global-actions{gap:5px}.home{min-height:44px;padding:5px 8px;font-size:13px}.shell{padding:8px}.catalog{padding-top:20px}.games{gap:10px}.game{min-height:200px;padding:12px 4px}.frame{height:calc(100dvh - 66px)}}@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style></head><body><div class="shell"><header><div class="brand">🌎 Pequeño Mundo</div><div class="global-actions"><button id="listenGlobal" class="home" hidden aria-label="Escuchar la instrucción">🔊</button><button id="home" class="home" hidden aria-label="Volver a elegir juego">⌂ Juegos</button></div></header><main><section id="catalog" class="catalog"><h1>¿A qué jugamos?</h1><p>Elige un juego.</p><div class="games"><button class="game" data-open="repartimos"><span class="art" aria-hidden="true">🥛 🧒</span><strong>Repartimos</strong><span id="status-repartimos">Uno para cada uno</span></button><button class="game" data-open="clasificamos"><span class="art" aria-hidden="true">🔴 🔵</span><strong>Clasificamos</strong><span id="status-clasificamos">Juntamos por color</span></button><button class="game" data-open="comparamos"><span class="art" aria-hidden="true">🍎 🍎🍎</span><strong>Comparamos</strong><span id="status-comparamos">Más, menos e igual</span></button></div><p class="caption">Sin prisa · Sin anuncios · Funciona sin conexión después de instalarse</p></section><section id="player" class="player" hidden><iframe id="gameframe" class="frame" title="Juego de Pequeño Mundo" allow="autoplay"></iframe></section></main></div><script>
'use strict';const games={repartimos:'./juegos/repartimos/index.html',clasificamos:'./juegos/clasificamos/index.html',comparamos:'./juegos/comparamos/index.html'};let active=null;let frameReady=false;const frame=document.getElementById('gameframe'),catalog=document.getElementById('catalog'),player=document.getElementById('player'),home=document.getElementById('home');
function updateStatus(){for(const [game,key] of Object.entries({repartimos:'pequeno-mundo-last-session',clasificamos:'pequeno-mundo-clasificacion-last-session',comparamos:'pequeno-mundo-comparamos-last-session'})){try{const data=JSON.parse(localStorage.getItem(key)||'[]');const n=Array.isArray(data)?new Set(data.map(x=>x.activity)).size:0;document.getElementById('status-'+game).textContent=n?`${n} de 5 actividades realizadas`:(game==='repartimos'?'Uno para cada uno':game==='clasificamos'?'Juntamos por color':'Más, menos e igual')}catch{}}}
function openGame(game,fromHistory=false){if(!games[game])return;if(active)stopChildAudio();frameReady=false;active=game;catalog.hidden=true;player.hidden=false;home.hidden=false;document.getElementById("listenGlobal").hidden=false;frame.src=games[game];frame.title=game==='repartimos'?'Repartimos':game==='clasificamos'?'Clasificamos':'Comparamos';if(!fromHistory)history.pushState({game},'', '#'+game)}
function stopChildAudio(){if(!active)return;try{frame.contentWindow.postMessage({type:'pm:stop-audio'},location.origin)}catch{}}
function goHome(fromHistory=false){if(!active)return;stopChildAudio();frameReady=false;frame.src='about:blank';active=null;player.hidden=true;catalog.hidden=false;home.hidden=true;document.getElementById("listenGlobal").hidden=true;if(!fromHistory)history.pushState(null,'',location.pathname+location.search);updateStatus()}
document.querySelectorAll('[data-open]').forEach(b=>b.addEventListener('click',()=>openGame(b.dataset.open)));home.addEventListener('click',()=>{goHome();});document.getElementById('listenGlobal').addEventListener('click',()=>{if(active&&frameReady)frame.contentWindow?.postMessage({type:'pm:repeat-audio'},location.origin)});frame.addEventListener('load',()=>{frameReady=Boolean(active)&&!frame.src.endsWith('about:blank')});document.addEventListener('visibilitychange',()=>{if(document.hidden)stopChildAudio()});window.addEventListener('pagehide',stopChildAudio);window.addEventListener('popstate',e=>{const desired=e.state?.game;if(desired&&games[desired]){if(active!==desired)openGame(desired,true)}else if(active)goHome(true)});window.addEventListener('message',e=>{if(e.origin!==location.origin||e.source!==frame.contentWindow)return;if(e.data?.type==='pm:navigate-home')goHome();if(e.data?.type==='pm:completed')updateStatus()});updateStatus();if(history.state?.game&&games[history.state.game])openGame(history.state.game,true);if('serviceWorker'in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('./sw.js').catch(()=>{});
</script></body></html>
