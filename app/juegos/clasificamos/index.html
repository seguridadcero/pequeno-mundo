function bind(el,id){el.addEventListener('pointerdown',e=>{if(e.button!==0||locked||done||drag)return;interruptSequence();drag={id,pid:e.pointerId,x:e.clientX,y:e.clientY,moved:false,source:el,from:objects[id].at};el.setPointerCapture(e.pointerId)});el.addEventListener('pointermove',e=>{if(!drag||drag.pid!==e.pointerId)return;const d=drag;if(!d.moved&&Math.hypot(e.clientX-d.x,e.clientY-d.y)>9){d.moved=true;el.style.visibility='hidden';const g=document.createElement('div');g.className='ghost';g.id='ghost';g.append(toy(objects[d.id]));document.body.append(g)}if(d.moved){moveGhost(e.clientX,e.clientY);targetHighlight(e.clientX,e.clientY)}});el.addEventListener('pointerup',e=>{if(!drag||drag.pid!==e.pointerId)return;const d=drag;drag=null;targetHighlight(null,null);if(d.moved){moveGhost(e.clientX,e.clientY);const dest=hit(e.clientX,e.clientY);if(dest===null){const tray=$('tray').getBoundingClientRect();if(e.clientX>=tray.left&&e.clientX<=tray.right&&e.clientY>=tray.top&&e.clientY<=tray.bottom){moveObject(d.id,null);$('ghost')?.remove()}else{motorReturns++;sessionStats.motorReturns++;returnGhost(d)}}else{moveObject(d.id,dest);$('ghost')?.remove()}}else{selected=selected===d.id?null:d.id;render();if(selected!==null)$('feedback').textContent='Ahora toca un grupo para dejar el objeto.'}});el.addEventListener('pointercancel',e=>{if(!drag||drag.pid!==e.pointerId)return;const d=drag;drag=null;motorReturns++;sessionStats.motorReturns++;targetHighlight(null,null);returnGhost(d)})}

<script>
(()=>{

  if(e.data?.type==='pm:stop-audio'){
   try{speechSynthesis.cancel()}catch{}
  }
