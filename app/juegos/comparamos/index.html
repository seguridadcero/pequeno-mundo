<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Comparamos · Pequeño Mundo</title><style>
:root{font-family:system-ui,sans-serif;color:#23443a;background:#f6f3ea}*{box-sizing:border-box}body{margin:0}button{font:inherit;cursor:pointer;touch-action:manipulation}button:focus-visible{outline:3px solid #1364a0;outline-offset:2px}.app{max-width:900px;margin:auto;padding:8px 12px;min-height:100dvh;display:flex;flex-direction:column;gap:10px}header{display:flex;align-items:center;justify-content:space-between}h1{font-size:clamp(22px,4vw,29px);margin:2px 0}.muted{color:#587166;font-size:14px}.prompt{background:white;border:2px solid #d9e4d8;border-radius:20px;padding:12px;font-size:clamp(17px,4vw,23px);font-weight:750;text-align:center;min-height:66px}.choices{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;flex:0 0 auto;min-height:0}.choice{background:#fffdf7;border:3px solid #cfdfcf;border-radius:24px;min-height:clamp(190px,39dvh,310px);padding:14px 8px;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:12px}.choice:active{transform:scale(.99)}.choice:disabled{opacity:.9}.fruit{width:clamp(38px,7vw,58px);height:clamp(38px,7vw,58px);display:inline-block;position:relative;background:#e45643;border:3px solid #bc3e32;border-radius:45% 45% 48% 48%;box-shadow:inset -6px -6px 0 #c94d3e}.fruit:before{content:'';position:absolute;left:48%;top:-9px;width:14px;height:9px;border-radius:80% 0;background:#448c58;transform:rotate(-25deg)}.fruits{display:flex;justify-content:center;align-items:center;flex-wrap:wrap;gap:7px;max-width:245px}.cookie{background:#d6a066!important;border-color:#a56f3d!important;border-radius:50%!important;box-shadow:inset -5px -5px 0 #b88451!important}.cookie:before{display:none}.choice.wrong{border-color:#b87861}.choice.right{border-color:#4b9c78}.equal{border:3px solid #bbd6ca;background:#e7f5eb;border-radius:20px;min-height:66px;font-weight:750;font-size:18px}.equal[hidden],.next[hidden],.intro[hidden]{display:none}.controls{margin-top:auto;display:flex;gap:10px;align-items:center;justify-content:center;flex-wrap:wrap}.controls button,.next,.intro button{border:2px solid #a9c7b7;border-radius:16px;background:white;min-height:50px;padding:9px 16px;font-weight:700}.next{background:#b7e4c6}.feedback{min-height:40px;font-weight:650;text-align:center}.intro{position:absolute;inset:0;background:#f6f3ea;z-index:5;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;text-align:center;gap:16px}.intro h2{font-size:34px;margin:0}.intro p{font-size:20px}.progress{display:flex;justify-content:center;gap:6px}.dot{width:12px;height:12px;border-radius:50%;background:#d5e1d6}.dot.on{background:#4a9b78}.pairing{position:fixed;inset:0;pointer-events:none;z-index:3}.pairing svg{width:100%;height:100%}.integrated header,.integrated #listen{display:none!important}.integrated .app{min-height:calc(100dvh - 70px)}.guide{animation:guide .8s ease-in-out 1}@keyframes guide{50%{transform:translateY(-5px) scale(1.025)}}@media(max-width:430px){.app{padding:6px 8px;gap:6px}.choice{min-height:140px;padding:8px 4px;gap:6px}.fruits{gap:5px}.fruit{width:clamp(34px,9vw,44px);height:clamp(34px,9vw,44px)}.prompt{min-height:60px;padding:8px}.controls button{padding:6px 10px;min-height:43px}.equal{min-height:55px}.feedback{min-height:30px;font-size:14px}}@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style></head><body><div class="intro" id="intro"><h2>🍎 Comparamos</h2><p>Vamos a descubrir dónde hay más, menos o la misma cantidad.</p><button id="start">Jugar ▶</button></div><main class="app"><header><h1>Comparamos</h1><span class="muted" id="stepLabel">1 de 5</span></header><div class="progress" id="progress"></div><div class="prompt" id="prompt" aria-live="polite"></div><div class="choices"><button class="choice" id="left" aria-label="Colección izquierda"><div class="fruits" id="leftFruits"></div><span class="muted">Aquí</span></button><button class="choice" id="right" aria-label="Colección derecha"><div class="fruits" id="rightFruits"></div><span class="muted">Aquí</span></button></div><button class="equal" id="equal" hidden aria-label="La misma cantidad">⚖️ <span aria-hidden="true">●● ↔ ●●</span> Igual cantidad</button><div class="pairing" id="pairing" aria-hidden="true"></div><div class="feedback" id="feedback" aria-live="polite"></div><div class="controls"><button id="help">💡 Ayuda</button><button id="listen">🔊 Escuchar</button><button id="next" class="next" hidden>Seguir ➜</button></div></main><script>
 'use strict';
const $=id=>document.getElementById(id);
const tasks=[
 [{a:2,b:3,kind:'more',guided:true}],
 [{a:3,b:2,kind:'more'},{a:2,b:4,kind:'more'}],
 [{a:2,b:3,kind:'less',guided:true},{a:4,b:2,kind:'less'}],
 [{a:3,b:3,kind:'equal',guided:true},{a:2,b:2,kind:'equal'}],
 [{a:3,b:3,kind:'equal',object:'cookie'},{a:2,b:3,kind:'less',object:'cookie'},{a:4,b:2,kind:'more',object:'cookie'}]
];
let stage=0,trial=0,done=false,voice='',instructionVoice='',records=[],started=0,attempts=0,errors=0,hints=0,assisted=false,helpLevel=0,roundToken=0;
let introTimer=null,voiceTimer=null;const speechAvailable=()=>typeof speechSynthesis!=='undefined';
function stopVoice(){if(speechAvailable())speechSynthesis.cancel()}
function say(t){voice=t;stopVoice();if(speechAvailable()){try{const u=new SpeechSynthesisUtterance(t);u.lang='es-ES';u.rate=.87;speechSynthesis.speak(u)}catch{}}}
function message(t,read=false){$('feedback').textContent=t;if(read)say(t)}
function current(){return tasks[stage][trial]}
function promptFor(r){const item=r.object==='cookie'?'galletas':'frutas';return stage>=3?(r.kind==='less'?`Compara los grupos. Toca donde hay menos ${item}, o iguales si tienen lo mismo.`:`Compara los grupos. Toca donde hay más ${item}, o iguales si tienen lo mismo.`):(r.kind==='more'?`Toca donde hay más ${item}.`:`Toca donde hay menos ${item}.`)}
function items(n,type){return Array.from({length:n},()=>`<span class="fruit ${type==='cookie'?'cookie':''}" aria-hidden="true"></span>`).join('')}
function expected(r){return r.kind==='equal'?'equal':r.kind==='more'?(r.a>r.b?'left':'right'):(r.a<r.b?'left':'right')}
function cancelTimers(){clearTimeout(introTimer);clearTimeout(voiceTimer)}
function render(){const r=current();$('stepLabel').textContent=(stage+1)+' de 5';$('progress').innerHTML=tasks.map((_,i)=>`<span class="dot ${i<=stage?'on':''}"></span>`).join('');$('leftFruits').innerHTML=items(r.a,r.object);$('rightFruits').innerHTML=items(r.b,r.object);$('equal').hidden=stage<3;$('prompt').textContent=promptFor(r);for(const id of ['left','right','equal','help'])$(id).disabled=done;$('next').hidden=!done;$('pairing').innerHTML='';$('feedback').textContent='';instructionVoice=promptFor(r);}
function pairs(){
 const r=current(), a=[...$('leftFruits').children],b=[...$('rightFruits').children];
 const lines=[];
 for(let i=0;i<Math.min(a.length,b.length);i++){
  const x=a[i].getBoundingClientRect(),y=b[i].getBoundingClientRect();
  lines.push(`<line x1="${x.left+x.width/2}" y1="${x.top+x.height/2}" x2="${y.left+y.width/2}" y2="${y.top+y.height/2}" stroke="#297b66" stroke-width="3" stroke-dasharray="6 5"/>`);
 }
 const extra=a.length>b.length?a.slice(b.length):b.slice(a.length);
 for(const el of extra){const z=el.getBoundingClientRect();lines.push(`<circle cx="${z.left+z.width/2}" cy="${z.top+z.height/2}" r="${z.width/2+5}" fill="none" stroke="#a25a32" stroke-width="3"/>`)}
 $('pairing').innerHTML=`<svg viewBox="0 0 ${innerWidth} ${innerHeight}" preserveAspectRatio="none" aria-hidden="true">${lines.join('')}</svg>`;
 assisted=true;helpLevel=2;message(r.a===r.b?'Cada objeto tiene pareja. No sobra ninguno.':`Mira las parejas. En un grupo sobran objetos.`,true)
}
function demonstrate(){const r=current();assisted=true;pairs();if(r.kind==='equal')message('Cada fruta tiene pareja. Hay la misma cantidad. Toca el botón de iguales.',true);else if(r.kind==='less')message('En un lado sobran frutas. En el otro hay menos. Toca donde hay menos.',true);else message('En un lado sobran frutas. Allí hay más. Toca donde hay más.',true)}
function begin(){cancelTimers();stopVoice();roundToken++;const token=roundToken;done=false;attempts=0;errors=0;hints=0;assisted=false;helpLevel=0;started=Date.now();render();const r=current();
// Gesto neutro: la ayuda se mueve brevemente sin indicar la respuesta.
introTimer=setTimeout(()=>{if(token!==roundToken||done)return;for(const el of [$('left'),$('right')]){el.classList.remove('guide');void el.offsetWidth;el.classList.add('guide');setTimeout(()=>el.classList.remove('guide'),850)}},280);
voiceTimer=setTimeout(()=>{if(token!==roundToken||done)return;if(r.guided)demonstrate();else say(promptFor(r))},1050)}
function choose(which){if(done)return;cancelTimers();const r=current();attempts++;if(which!==expected(r)){errors++;if(r.kind==='equal')message('Mira las dos colecciones. ¿Cada objeto tiene una pareja?',true);else message('Observa las dos colecciones. Puedes usar la ayuda para formar parejas.',true);return}
done=true;const independent=!assisted&&errors===0&&!r.guided;message(r.kind==='equal'?'¡Hay la misma cantidad!':r.kind==='more'?'¡Aquí hay más!':'¡Aquí hay menos!',true);$('next').hidden=false;for(const id of ['left','right','equal','help'])$(id).disabled=true;
records.push({activity:stage+1,trial:trial+1,kind:r.kind,attempts,errors,hints,assisted:assisted||r.guided,independent,seconds:Math.round((Date.now()-started)/1000)});
try{localStorage.setItem('pequeno-mundo-comparamos-last-session',JSON.stringify(records))}catch{}
try{if(parent!==window)parent.postMessage({type:'pm:progress'},location.origin)}catch{}}
function advance(){cancelTimers();stopVoice();if(trial+1<tasks[stage].length){trial++;begin()}else if(stage<tasks.length-1){stage++;trial=0;begin()}else{$('intro').hidden=false;$('intro').querySelector('h2').textContent='¡Terminamos!';$('intro').querySelector('p').textContent='Comparaste más, menos e igual cantidad.';$('start').textContent='Jugar otra vez';stage=0;trial=0;try{if(parent!==window)parent.postMessage({type:'pm:completed'},location.origin)}catch{}}}
$('start').addEventListener('click',()=>{$('intro').hidden=true;records=[];begin()});for(const id of ['left','right','equal'])$(id).addEventListener('click',()=>choose(id));$('help').addEventListener('click',()=>{if(done)return;hints++;assisted=true;if(helpLevel===0){helpLevel=1;message('Mira los dos grupos. ¿Qué ocurre si juntas los objetos de dos en dos?',true)}else pairs()});$('listen').addEventListener('click',()=>say(instructionVoice||promptFor(current())));$('next').addEventListener('click',advance);
window.addEventListener('message',e=>{if(e.origin!==location.origin||e.source!==parent)return;if(e.data?.type==='pm:stop-audio'){cancelTimers();stopVoice()}if(e.data?.type==='pm:repeat-audio')say(instructionVoice||promptFor(current()))});document.addEventListener('visibilitychange',()=>{if(document.hidden){cancelTimers();stopVoice()}});
window.addEventListener('resize',()=>{$('pairing').innerHTML=''});if(window.parent!==window)document.body.classList.add('integrated');
</script></body></html>
