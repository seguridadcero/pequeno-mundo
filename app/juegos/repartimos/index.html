}
function place(id,dest){
 if(locked||complete)return;
 const before=items[id].at;
 if(before===dest){selected=null;render();return}
 attempts++;
 const beforeCounts=countsNow();const beforeExcess=beforeCounts.filter(n=>n>1).reduce((sum,n)=>sum+n-1,0);
 items[id].at=dest;
 const counts=countsNow();const afterExcess=counts.filter(n=>n>1).reduce((sum,n)=>sum+n-1,0);
 if(afterExcess>beforeExcess)misplacements++;
 if(before!==null&&afterExcess<beforeExcess)corrections++;
 selected=null;render();
 if(items.every(x=>x.at!==null)&&counts.every(n=>n===1)){
  complete=true;$('continue').hidden=false;$('help').hidden=true;
  sayFeedback(steps[stage].transfer?'¡Ahora cada perrito tiene un cuenco!':'¡Ahora cada niño tiene un vaso!',true);
  storeResult();return;
 }
 // Una respuesta incorrecta completa no debe parecer un éxito ni dejar al niño sin acción.
 // El mensaje orienta la comprobación sin señalar a quién mover el objeto.
 const allDelivered=items.every(x=>x.at!==null);
 if(allDelivered&&afterExcess>0){
  wrongStateSeen=true;
  feedbackLevel++;
  sayFeedback(feedbackLevel===1?'Todavía no. '+eachOne():'Puedes mover los '+(steps[stage].transfer?'cuencos':'vasos')+' que ya están en las mesas. '+eachOne(),true);
 }else if(afterExcess>0){
  wrongStateSeen=true;
  sayFeedback('Sigue repartiendo. '+eachOne());
 }else if(before!==null&&corrections>0){
  sayFeedback('Moviste un '+objectName()+'. '+eachOne());
 }else{
  sayFeedback('Sigue repartiendo.');
 }
}
// Señal de manipulabilidad, no de destino: el objeto se mueve unos píxeles y vuelve.
// En corrección se elige un vaso de una mesa con uno (no el vaso sobrante),
// para no revelar cuál debe cambiar de lugar.
function showIntroGesture(local,onDone){
 const s=steps[stage];
 let source;
 if(s.repair){
   const counts=countsNow();const safe=counts.findIndex(n=>n===1);
   source=document.querySelector(`.desk[data-dest="${safe}"] .desk-button`);
 }else source=document.querySelector('.cup-button');
 if(!source)return;
 const rect=source.getBoundingClientRect();
 const hand=document.createElement('div');hand.className='hand intro-hand';hand.textContent='👆';
 hand.setAttribute('aria-hidden','true');
 hand.style.left=(rect.left+rect.width*.60)+'px';hand.style.top=(rect.top+rect.height*.55)+'px';
 document.body.append(hand);
 const frames=[{transform:'translate(-10%,0)',opacity:0},{transform:'translate(-10%,0)',opacity:1,offset:.15},{transform:'translate(8px,-9px)',opacity:1,offset:.48},{transform:'translate(-10%,0)',opacity:1,offset:.78},{transform:'translate(-10%,0)',opacity:0}];

}

<script>
(()=>{

   try{speechSynthesis.cancel()}catch{}
  }
  if(e.data?.type==='pm:repeat-audio'){
   const btn=document.getElementById('repeat')||document.getElementById('listen');
   if(btn)btn.click();
  }
 });
