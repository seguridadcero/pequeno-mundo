min(100%,170px);display:flex;align-items:end;justify-content:center}.child img{height:100%;width:100%;object-fit:contain;object-position:center bottom;filter:drop-shadow(0 3px 3px #4b35252c)}.tray{width:100%;height:clamp(82px,20vh,130px);border:4px solid #bf8957;border-bottom:10px solid #ab714b;border-radius:18px;background:linear-gradient(#f3c88d,#dca569);display:flex;align-items:center;justify-content:space-evenly;gap:2px;padding:5px;touch-action:none;transition:box-shadow .2s,background .2s}.tray.over{box-shadow:0 0 0 5px #5fae97;background:#f5d7a9}.cup{touch-action:none;user-select:none;-webkit-user-select:none;cursor:grab;width:clamp(46px,6vw,80px);height:clamp(57px,12vh,91px);flex:none;filter:drop-shadow(0 4px 2px #9c734a70)}.cup img{width:100%;height:100%;object-fit:contain;pointer-events:none}.cup:focus-visible{outline:4px solid #196e86;border-radius:10px}.cup.dragging{opacity:.3}.ghost{position:fixed;z-index:20;pointer-events:none;transform:translate(-50%,-50%);width:65px;height:80px;filter:drop-shadow(0 8px 7px #4565)}.feedback{min-height:33px;text-align:center;font-size:clamp(13px,1.5vw,18px);font-weight:800}.footer{display:flex;justify-content:center;gap:10px}.footer button{padding:8px 16px;background:#fffdf5;border:2px solid #b5d3c8;border-radius:16px;font-weight:800}.footer button:disabled{opacity:.45}.done{color:#1a7864}.hint{color:#9b6328}.tiny{font-size:12px;color:#526b67;text-align:center}.selected{outline:4px solid #f2aa30;border-radius:12px}
@media (orientation:landscape) and (max-height:470px){.app{height:100dvh;min-height:0;padding:5px 10px;gap:3px}.top{height:43px}.pill{padding:4px 10px;border-radius:14px}.progress{font-size:11px}.instruction{min-height:38px;padding:3px 8px;font-size:17px;border-radius:15px}.teacher{height:32px;width:32px;font-size:21px}.scene{min-height:0}.kids{padding:2px 14px 5px}.child{height:clamp(56px,15vh,90px)}.tray{height:clamp(68px,21vh,93px)}.cup{height:clamp(49px,16vh,68px);width:clamp(39px,6vw,60px)}.feedback{min-height:18px;font-size:12px}.footer button{padding:4px 10px;font-size:12px}.tiny{display:none}}

/* Dirección artística B: escenario suave, objetos protagonistas */
:root{color:#153f44;background:#f1f5e9}
body{background:radial-gradient(circle at 10% 15%,#d8f2ef 0,transparent 32%),linear-gradient(135deg,#eff6e8,#fff1db 65%,#e7f3e9)}
.brand{color:#123d42;text-shadow:0 1px 0 #fff}
.pill{box-shadow:0 4px 0 #a6c3b6,0 7px 15px #294d3b13;background:#fffdf9;border-color:#b5d1c6}
.instruction{background:linear-gradient(125deg,#fffefa,#fff9ee);box-shadow:0 7px 22px #715d3513;border-color:#eadac1}
.teacher{box-shadow:inset 0 -4px 0 #dfb88c,0 2px 7px #7a563029}
.scene{background:linear-gradient(180deg,#fff7e9b8,#f5e4c7b8),url("assets/aula.jpg") center/cover no-repeat;box-shadow:inset 0 0 40px #fff9e8,0 6px 24px #816e4914;border-color:#e6d6b9}
.window{opacity:.25;border-width:5px}.shelf{opacity:.13}.wall-art{position:absolute;right:22%;top:9%;font-size:clamp(18px,4vw,45px);color:#eab960;opacity:.2;pointer-events:none}
.tray{border-color:#b97e4d;border-bottom-color:#9e623e;background:#eeb477 url("assets/mesa.png") center / 100% 100% no-repeat;box-shadow:inset 0 3px 3px #fff5d6,0 6px 10px #8b593d29}

@media (prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:.01ms!important;transition-duration:.01ms!important}}

/* V4: pantalla móvil horizontal de verdad, no reducción de un póster */

</style></head><body><main class="app"><header class="top"><div class="brand">🌎 Pequeño Mundo</div><div class="tools"><button class="pill" id="audio" aria-label="Escuchar instrucción">🔊</button><button class="pill" id="reset">↻ Reiniciar</button></div></header><div class="progress" aria-label="Actividad 3 de 5">Actividad 3 de 5 <span class="dots">○ ○ <strong>●</strong> ○ ○</span></div><div class="instruction"><div class="teacher" aria-hidden="true">👩🏽‍🏫</div><span>Haz que cada niño tenga un vaso.</span></div><section class="scene" aria-label="Tres niños con vasos para repartir"><div class="kids" id="kids"></div></section><div class="feedback" id="feedback" aria-live="polite">Mueve los vasos entre las mesas.</div><div class="footer"><button id="hint">¿Cómo se mueve?</button><button id="check">Comprobar</button></div><div class="tiny">Arrastra un vaso o tócalo y elige otra mesa.</div></main><script>
const initial=[2,0,1];let counts=[...initial],selected=null,drag=null,done=false,usedHelp=false;const kids=document.getElementById('kids'),feedback=document.getElementById('feedback');const cupSVG='<img src="assets/vaso.png" draggable="false" alt="">';
function person(i){return `<img src="${['assets/nino_1.png','assets/nina_2.png','assets/nino_3.png'][i]}" draggable="false" alt="">`}
function say(t){if(!('speechSynthesis' in window))return; speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='es-ES';u.rate=.88;speechSynthesis.speak(u)}
function setFeedback(t,cls=''){feedback.textContent=t;feedback.className='feedback '+cls}
function render(){kids.innerHTML='';counts.forEach((count,i)=>{let station=document.createElement('div');station.className='station';station.innerHTML=`<div class="child">${person(i)}</div><div class="tray" data-tray="${i}" aria-label="Mesa del niño ${i+1}, ${count} ${count===1?'vaso':'vasos'}"></div>`;let tray=station.querySelector('.tray');for(let j=0;j<count;j++){let cup=document.createElement('div');cup.className='cup'+(selected===i?' selected':'');cup.setAttribute('role','button');cup.tabIndex=0;cup.setAttribute('aria-label',`Vaso del niño ${i+1}. Selecciona para mover`);cup.innerHTML=cupSVG;cup.dataset.from=i;cup.addEventListener('pointerdown',startDrag);cup.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();select(i)}});tray.appendChild(cup)}tray.addEventListener('click',()=>{if(selected!==null&&selected!==i)move(selected,i)});kids.appendChild(station)})}
function select(i){if(done)return;if(selected===i){selected=null;setFeedback('Toca otra mesa para mover el vaso.')}else if(counts[i]){selected=i;setFeedback('Ahora toca la mesa donde quieres ponerlo.')}render()}
function move(from,to){if(done||from===to||counts[from]<1)return;counts[from]--;counts[to]++;selected=null;setFeedback('Has movido un vaso. Comprueba si cada niño tiene uno.');render()}
function startDrag(e){if(done)return;const from=Number(e.currentTarget.dataset.from);if(e.button!==0&&e.pointerType==='mouse')return;const node=e.currentTarget;const startX=e.clientX,startY=e.clientY;drag={from,startX,startY,moved:false,node};node.setPointerCapture(e.pointerId);node.addEventListener('pointermove',onDrag);node.addEventListener('pointerup',endDrag,{once:true});node.addEventListener('pointercancel',cancelDrag,{once:true})}
function onDrag(e){if(!drag)return;const d=drag;if(!d.moved&&Math.hypot(e.clientX-d.startX,e.clientY-d.startY)>9){d.moved=true;d.node.classList.add('dragging');const ghost=document.createElement('div');ghost.className='ghost';ghost.innerHTML=cupSVG;document.body.appendChild(ghost);d.ghost=ghost}if(d.ghost){d.ghost.style.left=e.clientX+'px';d.ghost.style.top=e.clientY+'px'}document.querySelectorAll('.tray').forEach(t=>t.classList.toggle('over',!!t.getBoundingClientRect&&pointIn(t,e.clientX,e.clientY)))}
function pointIn(el,x,y){const r=el.getBoundingClientRect();return x>=r.left&&x<=r.right&&y>=r.top&&y<=r.bottom}
function cleanup(){if(!drag)return;drag.node.removeEventListener('pointermove',onDrag);drag.node.classList.remove('dragging');drag.ghost?.remove();drag=null;document.querySelectorAll('.tray').forEach(t=>t.classList.remove('over'))}
function endDrag(e){if(!drag)return;const d=drag;let target=[...document.querySelectorAll('.tray')].find(t=>pointIn(t,e.clientX,e.clientY));cleanup();if(d.moved){if(target&&Number(target.dataset.tray)!==d.from)move(d.from,Number(target.dataset.tray));else setFeedback('El vaso vuelve a su mesa.')}else select(d.from)}function cancelDrag(){cleanup();setFeedback('Puedes intentarlo otra vez.')}
document.getElementById('check').addEventListener('click',()=>{if(done)return;if(counts.every(n=>n===1)){done=true;setFeedback('¡Muy bien! Ahora cada niño tiene un vaso.','done');say('¡Muy bien! Ahora cada niño tiene un vaso.')}else{setFeedback('Todavía no. Mira cuántos vasos tiene cada niño.','hint');say('Mira cuántos vasos tiene cada niño.')}});
document.getElementById('hint').addEventListener('click',()=>{usedHelp=true;setFeedback('Puedes mover un vaso que ya está sobre una mesa. Arrástralo o tócalo y después toca otra mesa.','hint');say('Puedes mover un vaso que ya está sobre una mesa. Arrástralo o tócalo y después toca otra mesa.')});document.getElementById('audio').addEventListener('click',()=>say('Haz que cada niño tenga un vaso.'));document.getElementById('reset').addEventListener('click',()=>{if('speechSynthesis' in window)speechSynthesis.cancel();counts=[...initial];selected=null;done=false;usedHelp=false;setFeedback('Mueve los vasos entre las mesas.');render()});document.addEventListener('visibilitychange',()=>{if(document.hidden&&'speechSynthesis' in window)speechSynthesis.cancel()});render();
</script></body></html>
